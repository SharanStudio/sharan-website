name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST nightly, picks up database changes
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The publishable key is designed to be public. Row-level security and the read-only site views protect the data.
      SUPABASE_URL: https://rybddalhjrsblkebcnic.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_fs0SUMK0IA5hOe8Qa80FTQ_C6BSCfnz
      SITE_URL: https://sharanstudio.github.io
      SITE_BASE: /sharan-website
      ONEDRIVE_SHARE_URL: ${{ vars.ONEDRIVE_SHARE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
